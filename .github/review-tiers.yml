# Highest changed-file tier wins; sensitive wins overlaps. Unmatched and new
# paths are sensitive. Every PR gets QA; sensitive/unclassified changes get
# Security -> QA. QA verifies the author's risk_tier and may escalate.
# The PR template uses T0/T1/T2; sensitive corresponds to T0.
#
# Content always escalates to sensitive regardless of path: new/changed public
# endpoints or input parsing; auth/authz/session; crypto/keys; secrets or
# credentials; permission checks; tenant isolation or personal data;
# SQL/schema/migrations; dependencies and lockfiles including dev dependencies;
# CI/workflows; weakened assertions, deleted tests/snapshots or lowered test
# gates. Low test globs, if ever added, are additive-only and never exempt
# test weakening from Security review.
#
# Sensitive-floor paths may only be downgraded with explicit Security approval.
# README and docs carry authentication, security and release instructions;
# tests exercise those boundaries, so neither is low. LICENSE is static prose.
# No runtime module is justified as ordinary; unlisted paths remain sensitive.
version: 1
default_tier: sensitive
tiers:
  low:
    - LICENSE
  ordinary: []
  sensitive:
    # Review policy, ownership, CI and rulesets.
    - .github/review-tiers.yml
    - .github/workflows/**
    - .github/CODEOWNERS
    - CODEOWNERS
    - .github/rulesets/**
    - rulesets/**
    # Dependency manifests, locks and build/release tooling.
    - go.mod
    - go.sum
    - "**/go.mod"
    - "**/go.sum"
    - Makefile
    - "**/Makefile"
    - Dockerfile
    - "**/Dockerfile*"
    - scripts/**
    - registry.json
    # Provider runtime, input/auth/network/quota handling and host tests.
    - "*.go"
    - integration/**
    # Security-bearing usage, deployment and source documentation.
    - README.md
    - docs/**
    # Agent instructions, skills and tool permissions.
    - AGENTS.md
    - "**/AGENTS.md"
    - .claude/**
    - skills/**
    - "**/skills/**"
