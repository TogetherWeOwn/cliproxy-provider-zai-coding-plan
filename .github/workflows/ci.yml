name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            go.sum
            integration/hostcompat/go.sum
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Verify published modules
        run: |
          go mod download
          go mod verify
          go -C integration/hostcompat mod download
          go -C integration/hostcompat mod verify
      - name: Vet
        run: |
          go vet ./...
          go -C integration/hostcompat vet ./...
      - name: Unit race tests
        run: go test -race -count=1 ./...
      - name: Production C shared build and ABI symbol
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -buildmode=c-shared -o "${RUNNER_TEMP}/zai-coding-plan.so" .
          nm -D --defined-only "${RUNNER_TEMP}/zai-coding-plan.so" > "${RUNNER_TEMP}/symbols.txt"
          grep -Eq '[[:space:]]T[[:space:]]cliproxy_plugin_init$' "${RUNNER_TEMP}/symbols.txt"
      - name: Real v8.0.49 host, registry, and release-package race tests
        run: go -C integration/hostcompat test -race -count=1 -v ./...
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan working tree for secrets
        run: gitleaks dir --no-banner --redact --exit-code 1 .
      - name: Generic credential-pattern scan
        shell: bash
        run: |
          set -euo pipefail
          # Do not print matches; accidental credentials must not enter CI logs.
          if git grep -qEI '(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!go.sum' ':!integration/hostcompat/go.sum'; then
            echo 'Credential-like material found; remove it before publishing.'
            exit 1
          fi
